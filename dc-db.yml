version: '3.9'

networks:
  marketnetwork:
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1

services:
  database:
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    image: timescale/timescaledb-ha:pg14-latest
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432" # TODO unmap in prod
    volumes:
      - analytics-data:/home/postgres/pgdata/data
    networks:
      marketnetwork:
        ipv4_address: 10.5.0.2

volumes:
  analytics-data:
